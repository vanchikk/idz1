<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Пошук відділень Нової Пошти</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f6f9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .main-card { max-width: 900px; margin: 40px auto; border: none; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .np-logo { color: #e52d2d; font-weight: 800; letter-spacing: -1px; }
        .btn-np { background-color: #e52d2d; color: white; font-weight: 600; border: none; }
        .btn-np:hover { background-color: #c12222; color: white; }
        .badge-np { background-color: #e52d2d; color: white; font-size: 0.9rem; }
        .table-container { max-height: 500px; overflow-y: auto; }
    </style>
</head>
<body>

<div class="container">
    <div class="card main-card p-4">
        <h2 class="text-center mb-4"><span class="np-logo">Нова Пошта</span> — Пошук відділень</h2>
        
        <div class="row g-3 align-items-end mb-4">
            <div class="col-md-9">
                <label for="cityName" class="form-label fw-bold">Введіть назву населеного пункту України:</label>
                <input type="text" class="form-control form-control-lg" id="cityName" placeholder="Наприклад: Харків, Київ, Одеса...">
            </div>
            <div class="col-md-3">
                <button type="button" class="btn btn-np btn-lg w-100" id="searchBtn">Знайти</button>
            </div>
        </div>

        <div class="text-center d-none my-5" id="loader">
            <div class="spinner-border text-danger" style="width: 3rem; height: 3rem;" role="status">
                <span class="visually-hidden">Завантаження...</span>
            </div>
            <p class="mt-3 text-muted fw-medium">Запит до API Нової Пошти...</p>
        </div>

        <div id="resultsBlock" class="d-none">
            <h4 class="mb-3 text-secondary" id="resultsTitle">Знайдені відділення:</h4>
            <div class="table-responsive table-container border rounded">
                <table class="table table-striped table-hover m-0 align-middle">
                    <thead class="table-dark sticky-top">
                        <tr>
                            <th style="width: 15%;">№ Відділення</th>
                            <th style="width: 60%;">Адреса та опис</th>
                            <th style="width: 25%;">Вагові обмеження</th>
                        </tr>
                    </thead>
                    <tbody id="warehousesTableBody">
                        </tbody>
                </table>
            </div>
        </div>
        
        <div id="errorAlert" class="alert alert-danger d-none mt-3" role="alert"></div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
